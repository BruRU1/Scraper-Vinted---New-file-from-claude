name: Vinted Scraper

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC — every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config user.name "vinted-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.csv data/price_history.csv
          git diff --quiet --cached || git commit -m "Add scraped data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
